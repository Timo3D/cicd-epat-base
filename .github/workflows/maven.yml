name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Build and test with Maven
        run: ./mvnw -B verify

  snyk-scan:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
      - name: Run Snyk to check for vulnerabilities
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  docker:
    needs: [build-and-test, snyk-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.docker.outputs.image }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pushed image
        if: github.event_name != 'pull_request'
        run: docker pull "$IMAGE"
      # Pull requests don't push, so rebuild the image here from the layer cache
      - name: Rebuild image from cache
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.0 image \
            --ignorefile /.trivyignore \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "$IMAGE"
      - name: Tag scanned image as latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag "${IMAGE%:*}:latest" "$IMAGE"

  notify:
    needs: [build-and-test, snyk-scan, docker, trivy-scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          SNYK_RESULT: ${{ needs.snyk-scan.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
          COMMIT_TITLE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set; skipping notification"
            exit 0
          fi
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "🚫";; *) echo "❌";; esac; }
          if [ "$BUILD_RESULT" = success ] && [ "$SNYK_RESULT" = success ] && [ "$DOCKER_RESULT" = success ] && [ "$TRIVY_RESULT" = success ]; then
            status="✅ CI passed"
          else
            status="❌ CI failed"
          fi
          text="$status: $GITHUB_REPOSITORY ($GITHUB_REF_NAME)
          Commit: ${GITHUB_SHA::7} by $GITHUB_ACTOR
          ${COMMIT_TITLE%%$'\n'*}

          $(icon "$BUILD_RESULT") build-and-test: $BUILD_RESULT
          $(icon "$SNYK_RESULT") snyk-scan: $SNYK_RESULT
          $(icon "$DOCKER_RESULT") docker: $DOCKER_RESULT
          $(icon "$TRIVY_RESULT") trivy-scan: $TRIVY_RESULT

          $RUN_URL"
          resp=$(curl -sS --fail-with-body \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data "disable_web_page_preview=true") || { echo "Telegram API error: $resp"; exit 1; }
